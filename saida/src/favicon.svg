<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#991b1b" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Barra vertical -->
    <rect x="22" y="6" width="20" height="52" rx="6" fill="url(#redGrad)"/>
    <!-- Barra horizontal -->
    <rect x="6" y="22" width="52" height="20" rx="6" fill="url(#redGrad)"/>
  </g>
</svg>
